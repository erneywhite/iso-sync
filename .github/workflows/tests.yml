name: Tests

# Запускает самописный test-runner (`php tests/run.php`) на матрице
# PHP-версий, которые мы официально поддерживаем (см. README → Требования).
# Это не реальный интеграционный прогон (мы не качаем ISO в CI), а
# проверка чистой логики: парсер SHA256SUMS, кэш хэшей, валидация конфига,
# резолвер family-шаблонов, генератор папок discovery.

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - 'config/iso-list.schema.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # mbstring намеренно НЕ ставим: на проде CLI-PHP собран без него.
          # Пусть CI будет не щедрее боевого окружения, иначе незамеченная
          # mb_*-зависимость всплывает уже на сервере.
          extensions: curl, json
          coverage: none
          tools: none

      - name: Verify PHP version
        run: php -v

      # Тесты покрывают только lib/. Скрипты в корне (update_iso, index,
      # diag_*) ими не запускаются, поэтому синтаксис проверяем отдельно —
      # иначе опечатка в них обнаруживается прямо на сервере.
      - name: Lint all PHP files
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: php tests/run.php

      # Диагностические скрипты тестами не покрыты, а php -l ловит только
      # синтаксис. Прогон вхолостую отлавливает runtime-ошибки (TypeError,
      # обращение к отсутствующим функциям) до того, как их увидят на сервере.
      - name: Smoke-run diagnostics
        run: |
          php diag_uup.php --offline
          php diag_private.php
